name: Export compact questions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_compact_questions.py"
      - ".github/workflows/export-compact.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/export_compact_questions.py
      - name: Commit compact files
        shell: bash
        run: |
          set -euo pipefail
          git add working/compact scripts/export_compact_questions.py .github/workflows/export-compact.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Export compact question set [skip ci]"
          git push
