name: Sync and validate Gaokao dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-and-validate.yml"
      - "scripts/verifier.bundle.part*"
      - "scripts/finalizer.bundle.part*"
      - "scripts/sync_and_validate.py.gz.b64"
      - "scripts/sync_and_validate.py"
      - "scripts/finalize_verification.py.gz.b64"
      - "scripts/finalize_verification.py"

permissions:
  contents: write

concurrency:
  group: sync-gaokao-dataset
  cancel-in-progress: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verifier sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          parts=(scripts/verifier.bundle.part*)
          if (( ${#parts[@]} > 0 )); then
            cat "${parts[@]}" | base64 --decode | gzip --decompress > scripts/sync_and_validate.py
            chmod +x scripts/sync_and_validate.py
          elif [[ -f scripts/sync_and_validate.py.gz.b64 ]]; then
            base64 --decode scripts/sync_and_validate.py.gz.b64 | gzip --decompress > scripts/sync_and_validate.py
            chmod +x scripts/sync_and_validate.py
          fi

          finalizer_parts=(scripts/finalizer.bundle.part*)
          if (( ${#finalizer_parts[@]} > 0 )); then
            cat "${finalizer_parts[@]}" | base64 --decode | gzip --decompress > scripts/finalize_verification.py
            chmod +x scripts/finalize_verification.py
          elif [[ -f scripts/finalize_verification.py.gz.b64 ]]; then
            base64 --decode scripts/finalize_verification.py.gz.b64 | gzip --decompress > scripts/finalize_verification.py
            chmod +x scripts/finalize_verification.py
          fi

          echo "cca0e5dd168a6ed27a53b00391c5b7b87b3ba4f41dd074da1eb66759ef28fc70  scripts/finalize_verification.py" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          for name in ("scripts/sync_and_validate.py", "scripts/finalize_verification.py"):
              path = Path(name)
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
              print(f"syntax ok: {path}")
          PY

      - name: Synchronize and cross-check all six papers
        run: python scripts/sync_and_validate.py

      - name: Normalize and adjudicate documented disagreements
        run: python scripts/finalize_verification.py

      - name: Run repository-level structural validation
        run: python scripts/validate_dataset.py

      - name: Commit verified dataset
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          git rm -r --ignore-unmatch scripts/__pycache__
          rm -rf scripts/__pycache__

          shopt -s nullglob
          temporary=(
            scripts/verifier.bundle.part*
            scripts/finalizer.bundle.part*
            scripts/sync_and_validate.py.gz.b64
            scripts/finalize_verification.py.gz.b64
          )
          if (( ${#temporary[@]} > 0 )); then
            git rm --ignore-unmatch "${temporary[@]}"
          fi

          git add .gitignore README.md SOURCE_ATTRIBUTION.md DATA_LICENSE.md \
            VERIFICATION_POLICY.md VERIFICATION_REPORT.md schema.json metadata data \
            analysis verification scripts .github/workflows/sync-and-validate.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize verification of 2021-2026 dataset [skip ci]"
          git push
